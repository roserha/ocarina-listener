# Let's define to use our own Distro!

DISTRO ?= "ocarinaos"

# Some default values

USER_CLASSES ?= "buildstats"
PATCHRESOLVE = "noop"

BB_DISKMON_DIRS ??= "\
    STOPTASKS,${TMPDIR},1G,100K \
    STOPTASKS,${DL_DIR},1G,100K \
    STOPTASKS,${SSTATE_DIR},1G,100K \
    STOPTASKS,/tmp,100M,100K \
    HALT,${TMPDIR},100M,1K \
    HALT,${DL_DIR},100M,1K \
    HALT,${SSTATE_DIR},100M,1K \
    HALT,/tmp,10M,1K"

PACKAGECONFIG:append:pn-qemu-system-native = " sdl"

# CONF_VERSION is increased each time build/conf/ changes incompatibly and is used to
# track the version of this file when it was generated. This can safely be ignored if
# this doesn't mean anything to you.
CONF_VERSION = "2"


# Select our raspberry pi machine!
# MACHINE = "raspberrypi0-2w-64"
MACHINE = "raspberrypi3-64"

# Accept license things for meta-raspberrypi
LICENSE_FLAGS_ACCEPTED = "synaptics-killswitch"

# Add SSH
EXTRA_IMAGE_FEATURES = "debug-tweaks ssh-server-dropbear allow-empty-password empty-root-password allow-root-login"

# Remove unnecessary features
IMAGE_FEATURES:remove = " splash"
DISTRO_FEATURES:remove = " bluetooth nfc"

# Say where to download things
DL_DIR ?= "/home/build/data/downloads"

# Implement sysvinit for speeding things up
SSTATE_DIR ?= "/home/build/my-build/sstate-cache"
INIT_MANAGER = "sysvinit"

# Install a BAJILLION things: 

# net-tools for legacy ifconfig (VERIFY: prob unused, u use `ip` - try cutting),
IMAGE_INSTALL:append = " net-tools"
# wpa-supplicant for wifi (udhcpc from busybox does dhcp, no dhcpcd needed),
IMAGE_INSTALL:append = " wpa-supplicant"
# sysvinit-inittab for the serial getty (sysvinit itself comes from INIT_MANAGER),
IMAGE_INSTALL:append = " sysvinit-inittab"
# kernel-modules for drivers (wifi/i2s/i2c), i2c-tools for I2C debug (NOT i2s! diff bus),
IMAGE_INSTALL:append = " kernel-modules i2c-tools"
# alsa for the voicehat soundcard (utils gives the mixer-restore u see at boot),
IMAGE_INSTALL:append = " alsa-lib alsa-utils"
# all these thingies for ocarina-gui (VERIFY: most are weston deps, try cutting),
IMAGE_INSTALL:append = " fontconfig libxkbcommon libinput libgbm libdrm mesa"
# userland for vcgencmd cpu temp, coreutils for base64 (VERIFY: busybox has base64 too), weston/wayland for the screen, and my listener!
IMAGE_INSTALL:append = " userland weston wayland wayland-protocols weston-init ocarina-listener coreutils"

# Enables UART for serial monitoring and adds commands for splash screen

ENABLE_UART = "1"
CMDLINE:append = " console=serial0,115200 rw splash quiet initramfs_debug"
SERIAL_CONSOLES = "115200;ttyAMA0"

# Configs that are needed for the raspberry pi to properly work, for the mic to work as well, and extra settings for the display

RPI_EXTRA_CONFIG = "\ndtoverlay=disable-bt\ndtparam=i2s=on\ndtparam=audio=off\ndtoverlay=googlevoicehat-soundcard\ndtparam=i2c_arm=on\ndisable_splash=1\nramfsfile=core-image-minimal-initramfs-raspberrypi3-64.cpio.gz\nramfsaddr=-1\nhdmi_force_hotplug=1\nconfig_hdmi_boost=10\nhdmi_group=2\nhdmi_mode=87\nhdmi_cvt 1024 600 60 6 0 0 0"
MACHINE_FEATURES:append = " i2c"
RPI_KERNEL_DEVICETREE_OVERLAYS:append = " overlays/googlevoicehat-soundcard.dtbo"

# I needed to add this to stop things from glitching for some reason
HOSTTOOLS += "update-desktop-database"
ROOTFS_POSTPROCESS_COMMAND:remove = "update_font_cache;"

# Wayland/display setup
DISTRO_FEATURES:append = " wayland opengl"
DISTRO_FEATURES:remove = "x11 vulkan"

# Initramfs setup
INITRAMFS_IMAGE = "core-image-minimal-initramfs"
INITRAMFS_IMAGE_BUNDLE = "0"
INITRAMFS_MAXSIZE = "131072"

# Ocarina Splash
IMAGE_BOOT_FILES:append = " core-image-minimal-initramfs-${MACHINE}.cpio.gz;core-image-minimal-initramfs-raspberrypi3-64.cpio.gz"
