pcm.!default {
    type plug
    slave.pcm "hdmi_dmix"
}

pcm.hdmi_dmix {
    type dmix
    ipc_key 1024
    ipc_key_add_uid false
    ipc_perm 0666
    slave {
        pcm "hw:CARD=b1,DEV=0"
        period_time 0
        period_size 2048
        buffer_size 16384
        rate 48000
        channels 2
    }
}

ctl.!default {
    type hw
    card b1
}
